name: Datarhei Restreamer

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  actions: write

concurrency:
  group: datarhei-restreamer
  cancel-in-progress: false

jobs:
  restreamer:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          tailscale version

      - name: Create Tailscale Auth Key
        env:
          TS_API_KEY: ${{ secrets.TAILSCALE_API_KEY }}
        run: |
          set -e

          if [ -z "$TS_API_KEY" ]; then
            echo "TAILSCALE_API_KEY is missing."
            exit 1
          fi

          echo "Creating Tailscale Auth Key..."

          RESPONSE=$(curl -fsS \
            -u "${TS_API_KEY}:" \
            -X POST \
            "https://api.tailscale.com/api/v2/tailnet/-/keys" \
            -H "Content-Type: application/json" \
            -d '{
              "capabilities": {
                "devices": {
                  "create": {
                    "reusable": false,
                    "ephemeral": false,
                    "preauthorized": true
                  }
                }
              },
              "expirySeconds": 3600
            }')

          AUTH_KEY=$(echo "$RESPONSE" | jq -r '.key')

          if [ -z "$AUTH_KEY" ] || [ "$AUTH_KEY" = "null" ]; then
            echo "Failed to create Tailscale Auth Key."
            echo "$RESPONSE"
            exit 1
          fi

          echo "TS_AUTH_KEY=$AUTH_KEY" >> "$GITHUB_ENV"

      - name: Connect to Tailscale
        run: |
          sudo tailscale up \
            --auth-key="$TS_AUTH_KEY" \
            --hostname="github-restreamer"

          sleep 5

      - name: Show Tailscale IP
        run: |
          echo "=============================="
          echo "Tailscale IPv4:"
          tailscale ip -4
          echo "=============================="
          tailscale status

      - name: Create Restreamer folders
        run: |
          mkdir -p "$GITHUB_WORKSPACE/restreamer/config"
          mkdir -p "$GITHUB_WORKSPACE/restreamer/data"

      - name: Restore previous Restreamer data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e

          echo "Searching for previous backup..."

          ARTIFACT_ID=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '
              .artifacts[]
              | select(.name=="restreamer-data")
              | select(.expired==false)
              | [.id,.created_at]
              | @tsv
            ' 2>/dev/null \
            | sort -k2 \
            | tail -n 1 \
            | cut -f1)

          if [ -z "$ARTIFACT_ID" ]; then
            echo "No previous backup found."
            exit 0
          fi

          echo "Found backup: $ARTIFACT_ID"

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > restreamer-backup.zip

          mkdir -p restore-temp

          unzip -o restreamer-backup.zip \
            -d restore-temp

          if [ -d "restore-temp/restreamer" ]; then
            cp -a restore-temp/restreamer/. \
              "$GITHUB_WORKSPACE/restreamer/"
          else
            cp -a restore-temp/. \
              "$GITHUB_WORKSPACE/restreamer/" 2>/dev/null || true
          fi

          echo "Restreamer data restored."

      - name: Check Docker
        run: |
          docker --version
          docker info

      - name: Start Datarhei Restreamer
        run: |
          docker rm -f restreamer 2>/dev/null || true

          docker run -d \
            --name restreamer \
            --restart unless-stopped \
            -v "$GITHUB_WORKSPACE/restreamer/config:/core/config" \
            -v "$GITHUB_WORKSPACE/restreamer/data:/core/data" \
            -p 8080:8080 \
            -p 8181:8181 \
            -p 1935:1935 \
            -p 1936:1936 \
            -p 6000:6000/udp \
            datarhei/restreamer:latest

          echo "Restreamer started."

      - name: Show Restreamer information
        run: |
          sleep 15

          echo "=============================="
          echo "Tailscale IP:"
          tailscale ip -4
          echo "=============================="

          echo "Restreamer:"
          docker ps

          echo "=============================="
          echo "Restreamer Logs:"
          echo "=============================="

          docker logs --tail 100 restreamer || true

      - name: Keep Restreamer running
        run: |
          echo "Restreamer is running."

          END=$((SECONDS + 20400))

          while [ $SECONDS -lt $END ]; do

            if ! docker ps \
              --format '{{.Names}}' \
              | grep -q '^restreamer$'; then

              echo "Restreamer stopped."
              docker logs restreamer || true
              exit 1
            fi

            sleep 30

          done

          echo "6-hour cycle finished."

      - name: Stop Restreamer
        if: always()
        run: |
          docker stop restreamer 2>/dev/null || true

      - name: Save Restreamer data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restreamer-data
          path: restreamer/
          retention-days: 7
          overwrite: true
