name: OvenMediaEngine

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ovenmediaengine
  cancel-in-progress: false

jobs:
  ovenmediaengine:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip

      # ==============================
      # TAILSCALE
      # ==============================

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          tailscale version

      - name: Create Tailscale Auth Key
        env:
          TS_API_KEY: ${{ secrets.TAILSCALE_API_KEY }}
        run: |
          set -e

          if [ -z "$TS_API_KEY" ]; then
            echo "TAILSCALE_API_KEY is missing."
            exit 1
          fi

          echo "Creating Tailscale Auth Key..."

          RESPONSE=$(curl -fsS \
            -u "${TS_API_KEY}:" \
            -X POST \
            "https://api.tailscale.com/api/v2/tailnet/-/keys" \
            -H "Content-Type: application/json" \
            -d '{
              "capabilities": {
                "devices": {
                  "create": {
                    "reusable": false,
                    "ephemeral": false,
                    "preauthorized": true
                  }
                }
              },
              "expirySeconds": 3600
            }')

          AUTH_KEY=$(echo "$RESPONSE" | jq -r '.key')

          if [ -z "$AUTH_KEY" ] || [ "$AUTH_KEY" = "null" ]; then
            echo "Failed to create Tailscale Auth Key."
            echo "$RESPONSE"
            exit 1
          fi

          echo "TS_AUTH_KEY=$AUTH_KEY" >> "$GITHUB_ENV"

      - name: Connect to Tailscale
        run: |
          sudo tailscale up \
            --auth-key="$TS_AUTH_KEY" \
            --hostname="github-ovenmediaengine"

          sleep 5

      - name: Show Tailscale IP
        run: |
          echo "================================"
          echo "Tailscale IPv4"
          echo "================================"

          TS_IP=$(tailscale ip -4)
          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"
          echo "$TS_IP"

          echo
          echo "Tailscale status:"
          tailscale status

      # ==============================
      # RESTORE BACKUP
      # ==============================

      - name: Restore previous OME data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "Searching for previous OME backup..."

          ARTIFACT_ID=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '
              .artifacts[]
              | select(.name=="ovenmediaengine-data")
              | select(.expired==false)
              | [.id,.created_at]
              | @tsv
            ' \
            | sort -k2 \
            | tail -n 1 \
            | cut -f1)

          if [ -z "$ARTIFACT_ID" ]; then
            echo "No previous OME backup found."
          else
            echo "Found backup artifact: $ARTIFACT_ID"

            gh api \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
              > ovenmediaengine-backup.zip

            mkdir -p restore-temp

            unzip -o ovenmediaengine-backup.zip \
              -d restore-temp

            if [ -d "restore-temp/ome_launcher" ]; then
              cp -a restore-temp/ome_launcher/. "$GITHUB_WORKSPACE/" || true
            fi

            echo "OME data restored."
          fi

      # ==============================
      # OME LAUNCHER SETUP & START
      # ==============================

      - name: Download & Setup OME Docker Launcher
        run: |
          curl -OL 'https://raw.githubusercontent.com/AirenSoft/OvenMediaEngine/master/misc/ome_docker_launcher.sh'
          chmod +x ome_docker_launcher.sh
          sudo ./ome_docker_launcher.sh setup

      - name: Start OvenMediaEngine
        run: |
          echo "Starting OvenMediaEngine with Host IP: $TS_IP"
          sudo OME_HOST_IP="$TS_IP" ./ome_docker_launcher.sh start

      # ==============================
      # INFORMATION
      # ==============================

      - name: Show OvenMediaEngine information
        run: |
          sleep 15

          echo "================================"
          echo "Tailscale IP"
          echo "================================"

          echo "$TS_IP"

          echo
          echo "================================"
          echo "Docker Containers"
          echo "================================"

          docker ps

          echo
          echo "================================"
          echo "OME LOGS"
          echo "================================"

          docker logs --tail 150 ovenmediaengine || true

      # ==============================
      # HEALTH CHECK
      # ==============================

      - name: Check OvenMediaEngine
        run: |
          sleep 5

          if ! docker ps --format '{{.Names}}' | grep -q 'ovenmediaengine'; then
            echo "OvenMediaEngine failed to start."
            docker logs ovenmediaengine || true
            exit 1
          fi

          echo "OvenMediaEngine is running correctly."

      # ==============================
      # KEEP ALIVE
      # ==============================

      - name: Keep OvenMediaEngine running
        run: |
          echo "OvenMediaEngine is running."

          END=$((SECONDS + 20400))

          while [ $SECONDS -lt $END ]; do

            if ! docker ps --format '{{.Names}}' | grep -q 'ovenmediaengine'; then
              echo "OvenMediaEngine stopped unexpectedly."
              docker logs ovenmediaengine || true
              exit 1
            fi

            echo "OME is still running..."
            sleep 30

          done

          echo "Cycle finished."

      # ==============================
      # STOP
      # ==============================

      - name: Stop OvenMediaEngine
        if: always()
        run: |
          sudo ./ome_docker_launcher.sh stop 2>/dev/null || docker stop ovenmediaengine 2>/dev/null || true

      # ==============================
      # BACKUP
      # ==============================

      - name: Save OvenMediaEngine data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ovenmediaengine-data
          path: |
            conf/
            logs/
          retention-days: 7
          overwrite: true
